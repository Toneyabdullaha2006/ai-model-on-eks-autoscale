apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm
  template:
    metadata:
      labels:
        app: llm
    spec:
      containers:
      - name: llm
        image: YOUR_ECR_URL/eks-llm:latest
        ports:
        - containerPort: 8000
                resources:
          limits:
            cpu: "500m"
            memory: "1Gi"
         
    
            memory: "16Gi"
            cpu: "4"
          requests:
            memory: "8Gi"
            cpu: "2"