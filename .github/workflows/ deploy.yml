name: Deploy to EKS
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Configure AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-south-1
    - name: Build and Push to ECR
      run: |
        aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin ${{ secrets.ECR_URL }}
        docker build -t eks-llm .
        docker tag eks-llm:latest ${{ secrets.ECR_URL }}/eks-llm:latest
        docker push ${{ secrets.ECR_URL }}/eks-llm:latest
      - name: Deploy to EKS
        run: |
          aws eks update-kubeconfig --name eks-llm-cluster --region ap-south-1
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml